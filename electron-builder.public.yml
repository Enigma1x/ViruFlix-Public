appId: com.stevenmiranda.viruflix.public
productName: ViruFlix Public
directories:
  output: ../ViruFlix-Public-Releases-${version}
  buildResources: src/assets/icons
files:
  - dist/**/*
  - electron/**/*
  - package.json
asar: true
publish: null
win:
  target: nsis
  icon: src/assets/icons/vf_Symbol.png
  signAndEditExecutable: false
  artifactName: ViruFlix-Setup-${version}.${ext}
nsis:
  oneClick: false
  perMachine: false
  allowElevation: true
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  runAfterFinish: true
